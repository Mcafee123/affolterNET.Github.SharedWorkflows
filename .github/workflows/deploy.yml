name: Deploy and Tag

on:
  workflow_call:
    inputs:

      # Configuration
      build-file:
        description: "Path to build configuration JSON file"
        required: true
        type: string
      deploy-file:
        description: "Path to deployment configuration JSON file"
        required: true
        type: string

      # Deploy options
      tag:
        description: "Tag to deploy (if not provided, will read version and generate tag)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to check out for the deploy (overrides tag as checkout ref — e.g. a commit SHA for ephemeral release-flow deploys that have no git tag)"
        required: false
        type: string
        default: ""
      image-version:
        description: "Image version to deploy (overrides version extraction from the tag; required for ephemeral release-flow deploys and safe for rc versions containing dashes). When set, the tfvars are synced in-workspace before terraform plan — nothing is committed."
        required: false
        type: string
        default: ""
      trivy-scan-dir:
        description: "Path to .trivy_scans directory relative to repo root. Defaults to <tf-module-path>/.trivy_scans"
        required: false
        type: string
        default: ""
      run-security-scan:
        description: "Deprecated — scanning is now handled by the trivy-check terraform module. This input is ignored."
        required: false
        type: boolean
        default: false
      environment:
        description: "GitHub environment for the deploy job. When set, call this workflow with `secrets: inherit` so environment-scoped secrets (SSH_PRIVATE_KEY, AZURE_CREDENTIALS, ARM_*, ACR_*) resolve. Empty = no environment (backward compatible)."
        required: false
        type: string
        default: ""

    secrets:

      # Github
      ssh-private-key:
        required: false

      # Azure
      azure-credentials:
        required: false
      arm-client-id:
        required: false
      arm-client-secret:
        required: false
      arm-tenant-id:
        required: false
      arm-subscription-id:
        required: false

      # ACR
      acr-username:
        required: false
      acr-password:
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.determine.outputs.version }}
      tag: ${{ steps.determine.outputs.tag }}
      checkout-ref: ${{ steps.determine.outputs.checkout-ref }}
    steps:
    - name: Checkout code (only if no tag and no image-version provided)
      if: inputs.tag == '' && inputs.image-version == ''
      uses: affolterNET/affolterNET.Github.SharedWorkflows/actions/checkout@main

    - name: Load configuration (only if no tag and no image-version provided)
      if: inputs.tag == '' && inputs.image-version == ''
      id: config
      uses: affolterNET/affolterNET.Github.SharedWorkflows/actions/load-config@main
      with:
        build-file: ${{ inputs.build-file }}
        deploy-file: ${{ inputs.deploy-file }}

    - name: Read version from action (only if no tag and no image-version provided)
      if: inputs.tag == '' && inputs.image-version == ''
      id: get-version
      uses: affolterNET/affolterNET.Github.SharedWorkflows/actions/version@main
      with:
        project_file: ${{ steps.config.outputs.backend-root }}/${{ steps.config.outputs.backend-folder }}/${{ steps.config.outputs.backend-project-file}}
        action: read
        scripts-version: ${{ steps.config.outputs.scripts-version }}

    - name: Determine final version and tag
      id: determine
      run: |
        if [ -n "${{ inputs.tag }}" ]; then
          # Tag provided - extract version from it
          TAG="${{ inputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            VERSION="${TAG##*-}"
          else
            VERSION="$TAG"
          fi
          echo "Using input tag: $TAG"
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        elif [ -n "${{ inputs.image-version }}" ]; then
          # No tag but explicit image-version (ephemeral release-flow deploy):
          # label with the real version — no csproj read, no misleading sb-… tag.
          VERSION="${{ inputs.image-version }}"
          TAG="$VERSION"
          echo "Using image-version as label: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        else
          # No tag provided - use version from action and generate tag
          VERSION="${{ steps.get-version.outputs.version }}"
          TAG="${{ steps.config.outputs.tag-prefix }}-$VERSION"
          echo "Using version from action: $VERSION"
          echo "Generated tag: $TAG"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        fi

        # image-version wins over any extraction — rc versions contain dashes, which the
        # tag-suffix extraction above cannot handle, and ephemeral deploys have no tag at all.
        if [ -n "${{ inputs.image-version }}" ]; then
          echo "Overriding version with image-version input: ${{ inputs.image-version }}"
          echo "version=${{ inputs.image-version }}" >> $GITHUB_OUTPUT
        fi

        # Contract guard: image-version without tag AND without ref would fall back to
        # checking out the bare version string (not a git ref) and fail cryptically later.
        if [ -n "${{ inputs.image-version }}" ] && [ -z "${{ inputs.tag }}" ] && [ -z "${{ inputs.ref }}" ]; then
          echo "❌ image-version requires either 'tag' (rc/promote deploys) or 'ref' (ephemeral deploys pass the commit SHA) — there is no git ref to check out otherwise."
          exit 1
        fi

        # Checkout ref: explicit ref input (ephemeral deploys pass the commit SHA) or the
        # determined tag (input or generated) — the latter is today's behavior, unchanged.
        if [ -n "${{ inputs.ref }}" ]; then
          echo "checkout-ref=${{ inputs.ref }}" >> $GITHUB_OUTPUT
        else
          echo "checkout-ref=$TAG" >> $GITHUB_OUTPUT
        fi

    - name: Summary
      run: |
        echo "🔢 Version and Tag Determination Summary"
        echo "  Inputs:"
        echo "    - input-tag: ${{ inputs.tag != '' && inputs.tag || '(not provided - will read from action)' }}"
        echo "  Final results:"
        echo "    - version: ${{ steps.determine.outputs.version }}"
        echo "    - tag: ${{ steps.determine.outputs.tag }}"
  
  deploy:
    name: 'deploy: ${{ needs.prepare.outputs.tag }}'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: prepare
    steps:

    - name: Checkout code
      uses: affolterNET/affolterNET.Github.SharedWorkflows/actions/checkout@main
      with:
        ref: ${{ needs.prepare.outputs.checkout-ref }}

    # Load configuration
    - name: Load configuration
      id: config
      uses: affolterNET/affolterNET.Github.SharedWorkflows/actions/load-config@main
      with:
        build-file: ${{ inputs.build-file }}
        deploy-file: ${{ inputs.deploy-file }}

    - name: Deploy Workflow Started
      shell: bash
      run: |
        echo "🚀 Starting Deploy and Tag Workflow"
        echo "All inputs received:"
        echo "  Docker inputs:"
        echo "    - image-name: ${{ steps.config.outputs.image-name }}"
        echo "    - registry-name: ${{ steps.config.outputs.registry-name }}"
        echo "  Version inputs:"
        echo "    - version: ${{ needs.prepare.outputs.version }}"
        echo "    - tag: ${{ needs.prepare.outputs.tag }}"
        echo "  Tag inputs:"
        echo "    - tag-prefix: ${{ steps.config.outputs.tag-prefix }}"
        echo "  Terraform inputs:"
        echo "    - tf-module-path: ${{ steps.config.outputs.tf-module-path }}"
        echo "  Secrets provided:"
        echo "    - ssh-private-key: $([ -n '${{ secrets.ssh-private-key || secrets.SSH_PRIVATE_KEY }}' ] && echo 'Yes' || echo 'No')"
        echo "    - azure-credentials: $([ -n '${{ secrets.azure-credentials || secrets.AZURE_CREDENTIALS }}' ] && echo 'Yes' || echo 'No')"
        echo "    - arm-client-id: $([ -n '${{ secrets.arm-client-id || secrets.ARM_CLIENT_ID }}' ] && echo 'Yes' || echo 'No')"
        echo "    - arm-client-secret: $([ -n '${{ secrets.arm-client-secret || secrets.ARM_CLIENT_SECRET }}' ] && echo 'Yes' || echo 'No')"
        echo "    - arm-tenant-id: $([ -n '${{ secrets.arm-tenant-id || secrets.ARM_TENANT_ID }}' ] && echo 'Yes' || echo 'No')"
        echo "    - arm-subscription-id: $([ -n '${{ secrets.arm-subscription-id || secrets.ARM_SUBSCRIPTION_ID }}' ] && echo 'Yes' || echo 'No')"
        echo "    - acr-username: $([ -n '${{ secrets.acr-username || secrets.ACR_USERNAME }}' ] && echo 'Yes' || echo 'No')"
        echo "    - acr-password: $([ -n '${{ secrets.acr-password || secrets.ACR_PASSWORD }}' ] && echo 'Yes' || echo 'No')"

    - name: Install Trivy
      env:
        # Pin to v0.69.3 — last known safe release before supply chain attack (GHSA-69fq-xp46-6x23)
        # Install from immutable GitHub release, NOT from apt repo (compromised in v0.69.4)
        TRIVY_VERSION: "0.69.3"
      run: |
        wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
        wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
        sha256sum --check --ignore-missing "trivy_${TRIVY_VERSION}_checksums.txt"
        sudo dpkg -i "trivy_${TRIVY_VERSION}_Linux-64bit.deb"
        rm -f "trivy_${TRIVY_VERSION}_Linux-64bit.deb" "trivy_${TRIVY_VERSION}_checksums.txt"
        trivy --version

    - name: Cache Trivy DB
      uses: actions/cache@v5
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          trivy-db-${{ runner.os }}-

    - name: Pre-download Trivy DB
      run: trivy image --download-db-only --cache-dir ~/.cache/trivy

    - name: Docker Login to ACR
      uses: docker/login-action@v4
      with:
        registry: ${{ steps.config.outputs.registry-name }}
        username: ${{ secrets.acr-username || secrets.ACR_USERNAME }}
        password: ${{ secrets.acr-password || secrets.ACR_PASSWORD }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: '1.7.5'
        terraform_wrapper: false  # Needed to properly capture outputs

    - name: Azure Login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.azure-credentials || secrets.AZURE_CREDENTIALS }}

    - name: Setup SSH key for private repositories
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.ssh-private-key || secrets.SSH_PRIVATE_KEY }}

    # release-flow EPHEMERAL deploys only (ref-based — tag-based deploys carry correctly
    # committed tfvars at the checked-out tag): sync the tfvars in the workflow workspace,
    # never committing. Anchored to the exact `image_name =` assignment (a loose pattern
    # would also rewrite e.g. sidecar_image_name) and VERIFIED — a format drift must fail
    # the deploy loudly, not silently apply the stale committed version.
    - name: Sync tfvars in-workspace (image-version)
      if: ${{ inputs.image-version != '' && inputs.ref != '' && steps.config.outputs.tfvars-files != '' }}
      shell: bash
      run: |
        VERSION="${{ inputs.image-version }}"
        for f in ${{ steps.config.outputs.tfvars-files }}; do
          if [ -f "$f" ]; then
            sed -i "s|^\([[:space:]]*image_name[[:space:]]*=[[:space:]]*\".*:\)[^\"]*\"|\1$VERSION\"|" "$f"
            if ! grep -q ":$VERSION\"" "$f"; then
              echo "❌ tfvars sync failed: no image_name line in $f was updated to :$VERSION — the tfvars format has drifted from the expected 'image_name = \"registry/name:version\"'."
              exit 1
            fi
            echo "synced $f:"; grep "image_name" "$f"
          fi
        done

    # An empty module path would make terraform run in the repo root and fail late with a
    # confusing 'No configuration files' — fail fast with the actual cause instead.
    - name: Verify deploy target resolved
      shell: bash
      run: |
        if [ -z "${{ steps.config.outputs.tf-module-path }}" ]; then
          echo "❌ No deploy target for branch '${{ github.head_ref || github.ref_name }}' — add a mapping (modulePath/tfvarsFile) for it in the deploy configuration file."
          exit 1
        fi

    - name: Terraform Init
      run: terraform init -backend-config=_backend.hcl
      working-directory: ${{ steps.config.outputs.tf-module-path }}
      env:
        ARM_CLIENT_ID: ${{ secrets.arm-client-id || secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.arm-client-secret || secrets.ARM_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.arm-tenant-id || secrets.ARM_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.arm-subscription-id || secrets.ARM_SUBSCRIPTION_ID }}
        ARM_USE_CLI: false

    - name: Terraform Plan
      id: plan
      run: |
        terraform plan -out=tfplan
        echo "plan_status=success" >> $GITHUB_OUTPUT
      working-directory: ${{ steps.config.outputs.tf-module-path }}
      env:
        ARM_CLIENT_ID: ${{ secrets.arm-client-id || secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.arm-client-secret || secrets.ARM_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.arm-tenant-id || secrets.ARM_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.arm-subscription-id || secrets.ARM_SUBSCRIPTION_ID }}
        ARM_USE_CLI: false

    - name: Terraform Apply
      id: apply
      run: |
        terraform apply -auto-approve tfplan
        echo "apply_status=success" >> $GITHUB_OUTPUT
      working-directory: ${{ steps.config.outputs.tf-module-path }}
      env:
        ARM_CLIENT_ID: ${{ secrets.arm-client-id || secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.arm-client-secret || secrets.ARM_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.arm-tenant-id || secrets.ARM_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.arm-subscription-id || secrets.ARM_SUBSCRIPTION_ID }}
        ARM_USE_CLI: false

    - name: Cleanup Terraform plan
      if: always()
      run: rm -f tfplan
      working-directory: ${{ steps.config.outputs.tf-module-path }}

    - name: Create deployment summary
      run: |
        VERSION="${{ needs.prepare.outputs.version }}"
        TAG="${{ needs.prepare.outputs.tag }}"
        echo "## 🚀 App Deployment Completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** Development" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** ${{ steps.config.outputs.registry-name }}/${{ steps.config.outputs.image-name }}:$VERSION" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Deployment Information:" >> $GITHUB_STEP_SUMMARY
        echo "- **Terraform Directory:** tf/dev/app" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY

    - name: Get CI utils
      if: always()
      uses: affolterNET/affolterNET.Github.SharedWorkflows/actions/get-scripts@main
      with:
        scripts: "scripts/ci_utils.sh"

    - name: Commit trivy scan reports
      if: always()
      continue-on-error: true
      run: |
        SCAN_DIR="${{ inputs.trivy-scan-dir }}"
        if [ -z "$SCAN_DIR" ]; then
          SCAN_DIR="${{ steps.config.outputs.tf-module-path }}/.trivy_scans"
        fi

        if [ ! -d "$SCAN_DIR" ] || [ -z "$(git status "$SCAN_DIR" --porcelain 2>/dev/null)" ]; then
          echo "No trivy scan changes to commit"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "$SCAN_DIR"
        git commit -m "chore: update trivy scan reports"

        source "$GITHUB_WORKSPACE/scripts/ci_utils.sh"
        push_with_retry

